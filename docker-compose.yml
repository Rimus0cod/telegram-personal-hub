services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub-local}
      POSTGRES_DB: hub
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://hub:${POSTGRES_PASSWORD:-hub-local}@db:5432/hub
      BOT_TOKEN: ${BOT_TOKEN:-}
      INIT_DATA_MAX_AGE: ${INIT_DATA_MAX_AGE:-86400}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      WEBAPP_URL: ${WEBAPP_URL:-https://your-domain.example}
    depends_on: [backend]
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["${PORT:-8080}:80"]
    depends_on:
      backend: {condition: service_healthy}
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: ["http", "frontend:80", "--url=${WEBAPP_URL:-https://your-domain.example}"]
    depends_on: [frontend]
volumes:
  postgres_data:
