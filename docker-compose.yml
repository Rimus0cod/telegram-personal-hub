x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# COMPOSE_PROJECT_NAME is set explicitly in .env for production. Compose also
# derives a project name from the directory when the variable is unset; do not
# rely on that for production, because equal directory names can collide.
x-backend: &backend
  build: ./backend
  image: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must not be empty}-backend

services:
  db:
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    stop_grace_period: 60s
    logging: *default-logging
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: hub
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    logging: *default-logging
    # Rate-limit counters are ephemeral; losing them on restart is acceptable.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql+psycopg://hub:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/hub
    depends_on:
      db: {condition: service_healthy}
  backend:
    <<: *backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    stop_grace_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql+psycopg://hub:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/hub
      BOT_TOKEN: ${BOT_TOKEN:-}
      INIT_DATA_MAX_AGE: ${INIT_DATA_MAX_AGE:-86400}
      REDIS_URL: redis://redis:6379/0
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-0.25}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  bot:
    build: ./bot
    image: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must not be empty}-bot
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    stop_grace_period: 15s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      WEBAPP_URL: ${WEBAPP_URL:?WEBAPP_URL must be set}
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    build: ./frontend
    image: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must not be empty}-frontend
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
    logging: *default-logging
    ports: ["${PORT:-8080}:80"]
    depends_on:
      backend: {condition: service_healthy}
  ngrok:
    image: ngrok/ngrok:latest@sha256:ff3b5c3674432d14a786349908b7bdf28ee56c25662637afcbe7180d471993ef
    profiles: ["tunnel"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    logging: *default-logging
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: ["http", "frontend:80", "--url=${WEBAPP_URL:?WEBAPP_URL must be set}"]
    depends_on: [frontend]
volumes:
  postgres_data:
